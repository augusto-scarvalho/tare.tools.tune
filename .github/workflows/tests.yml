name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per pull request (a newer commit cancels the older run); every push to main runs to the end.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the numpy and scipy every render was verified with: the determinism table is the measurement per machine
          - { os: windows-latest, python: "3.12", pin: "-c constraints.txt" }
          - { os: ubuntu-24.04, python: "3.12", pin: "-c constraints.txt" }
          - { os: ubuntu-24.04-arm, python: "3.12", pin: "-c constraints.txt" }
          - { os: macos-latest, python: "3.12", pin: "-c constraints.txt" }
          # the oldest Python the package supports, on whatever numpy and scipy pip picks for it
          - { os: ubuntu-24.04, python: "3.10", pin: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev,export]" ${{ matrix.pin }}
      - name: Lint
        run: python -m ruff check .
      - name: Tests (the slow renders are left to a full local run)
        run: python -m pytest -q -m "not slow" --ignore=tests/test_determinism.py
      - name: Determinism against the Windows references
        if: ${{ matrix.pin != '' && !cancelled() }}
        run: python -m pytest -q -s tests/test_determinism.py
