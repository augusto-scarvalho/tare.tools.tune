[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creaturesynth"
version = "0.1.0"
description = "Procedural game audio: creature voices, human speech (pt-BR, English), sound effects and music, deterministic and portable, with a Game Boy cry engine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["procedural audio", "sound design", "game audio", "creature", "synthesizer", "speech synthesis", "tts"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
asr = ["faster-whisper>=1.0"]   # tools/intelligibility.py
teacher = ["kokoro>=0.9", "soundfile", "pyworld"]   # tools/build_speech.py and the calibration tools only
clap = ["transformers>=4.40", "torch", "soundfile"]   # design/match/judge creatures with CLAP
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.7"]

[project.scripts]
creaturesynth = "creaturesynth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/creaturesynth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
