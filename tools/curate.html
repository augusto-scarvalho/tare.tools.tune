<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curadoria</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2e0da; --accent: #c2410c;
  --accent-soft: #fde7d9; --good: #15803d; --good-soft: #dcfce7; --chip: #efede8; --focus: #2563eb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214; --panel: #1b1b1f; --ink: #ececef; --muted: #9a9aa3; --line: #2c2c33; --accent: #fb923c;
    --accent-soft: #3a2416; --good: #4ade80; --good-soft: #13301d; --chip: #26262c; --focus: #60a5fa;
  }
}
:root[data-theme="dark"] {
  --bg: #121214; --panel: #1b1b1f; --ink: #ececef; --muted: #9a9aa3; --line: #2c2c33; --accent: #fb923c;
  --accent-soft: #3a2416; --good: #4ade80; --good-soft: #13301d; --chip: #26262c; --focus: #60a5fa;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI",
  Roboto, sans-serif; }
button { font: inherit; color: inherit; background: var(--chip); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 9px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--focus);
  outline-offset: 1px; }
button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
select, textarea, input { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 6px; }
.app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
aside { border-right: 1px solid var(--line); padding: 14px; background: var(--panel); position: sticky; top: 0;
  height: 100vh; overflow: auto; }
aside h1 { font-size: 15px; margin: 0 0 10px; }
aside select { width: 100%; margin-bottom: 12px; }
.glist { list-style: none; padding: 0; margin: 0; }
.glist li { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.glist li:hover { background: var(--chip); }
.glist li.cur { background: var(--accent-soft); color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; }
.dot.done { background: var(--good); border-color: var(--good); }
main { padding: 16px 20px 60px; min-width: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.bar .grow { flex: 1; }
.status { color: var(--muted); font-size: 12px; }
.intro, .note { color: var(--muted); white-space: pre-wrap; margin: 4px 0 12px; }
h2 { font-size: 18px; margin: 6px 0 2px; }
.keys { color: var(--muted); font-size: 12px; }
kbd { background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }
.seg { display: grid; grid-template-columns: 170px 1fr 230px; gap: 12px; align-items: stretch; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
.seg.playing { border-color: var(--accent); }
.seg.picked { box-shadow: inset 0 0 0 2px var(--good); }
.who { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.who .lbl { font-weight: 600; overflow-wrap: anywhere; }
.who .sn { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.badge { display: inline-block; min-width: 22px; text-align: center; background: var(--chip); border-radius: 5px;
  font-size: 12px; padding: 1px 5px; margin-right: 6px; }
.viz { position: relative; min-width: 0; height: 128px; background: #0b0b0e; border-radius: 6px; overflow: hidden;
  cursor: crosshair; }
.viz canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.viz .tag { position: absolute; left: 6px; top: 4px; font-size: 11px; color: #cfcfd6; background: #0008;
  padding: 0 5px; border-radius: 4px; pointer-events: none; }
.tasks { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.rate { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.rate span { color: var(--muted); margin-right: 4px; }
.rate button { padding: 2px 7px; }
.scale { flex-basis: 100%; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted);
  padding-left: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.chip { background: var(--chip); border-radius: 5px; padding: 1px 6px; font-size: 11px; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  margin: 14px 0; }
.panel h3 { margin: 0 0 8px; font-size: 14px; }
.cmp { width: 100%; height: 220px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; margin-top: 6px; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
table { border-collapse: collapse; font-size: 12px; width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td.best { background: var(--good-soft); color: var(--good); font-weight: 600; }
.tablewrap { overflow-x: auto; }
textarea { width: 100%; min-height: 70px; resize: vertical; }
.marks { list-style: none; padding: 0; margin: 6px 0 0; }
.marks li { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
.marks input { flex: 1; min-width: 0; }
.abx { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .seg { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Curadoria</h1>
    <select id="roundSel" aria-label="Rodada"></select>
    <ul class="glist" id="glist"></ul>
  </aside>
  <main id="main"><div class="empty">Carregando…</div></main>
</div>
<script>
"use strict";
const S = { rounds: [], name: null, m: null, ans: {}, gi: 0, buf: {}, ana: {}, gain: {}, ctx: null, play: null,
            last: null, loop: false, match: true, view: "spec", revealed: new Set(), saveT: null, raf: 0 };
const $ = (sel, el = document) => el.querySelector(sel);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
};
const maxOf = a => { let m = -Infinity; for (const v of a) if (v > m) m = v; return m; };
const fmt = v => v == null ? "–" : Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2);

// ------------------------------------------------------------------ data
async function loadRounds() {
  S.rounds = await (await fetch("/api/rounds")).json();
  const sel = $("#roundSel");
  sel.replaceChildren(...S.rounds.map(r => h("option", { value: r.name }, `${r.title} (${r.answered}/${r.groups})`)));
  sel.onchange = () => { location.hash = `${encodeURIComponent(sel.value)}/0`; openRound(sel.value); };
  const want = decodeURIComponent(location.hash.slice(1).split("/")[0]) || (S.rounds[0] && S.rounds[0].name);
  if (want) { sel.value = want; await openRound(want); }
  else $("#main").replaceChildren(h("div", { class: "empty" }, "Nenhuma rodada ainda."));
}
async function openRound(name) {
  stop();
  const r = await (await fetch(`/api/round/${encodeURIComponent(name)}`)).json();
  Object.assign(S, { name, m: r.manifest, ans: r.answers || {}, buf: {}, ana: {}, gain: {}, revealed: new Set() });
  const gi = parseInt(location.hash.split("/")[1] || "0", 10);
  S.gi = Math.min(Math.max(isNaN(gi) ? 0 : gi, 0), S.m.groups.length - 1);
  renderList(); await openGroup(S.gi);
}
function save() {
  clearTimeout(S.saveT);
  $("#status") && ($("#status").textContent = "salvando…");
  S.saveT = setTimeout(async () => {
    const res = await fetch(`/api/round/${encodeURIComponent(S.name)}/answers`, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(S.ans) });
    $("#status") && ($("#status").textContent = res.ok ? "salvo ✓" : "erro ao salvar");
    renderList();
  }, 350);
}
const G = () => S.m.groups[S.gi];
const ga = () => (S.ans[G().id] ??= {});
const filled = v => v != null && v !== "" && (Array.isArray(v) ? v.length > 0 : typeof v === "object" ? Object.values(v).some(filled) : true);
const answered = g => Object.values(S.ans[g.id] || {}).some(filled);
const blind = g => S.m.blind && !S.revealed.has(g.id);

// ------------------------------------------------------------------ order and names
function hash(s) { let x = 2166136261; for (const c of s) { x ^= c.charCodeAt(0); x = Math.imul(x, 16777619); } return x >>> 0; }
function order(g) {
  const segs = g.segments.slice();
  if (!blind(g)) return segs;
  let seed = hash(S.name + "/" + g.id);
  for (let i = segs.length - 1; i > 0; i--) {
    seed = Math.imul(seed ^ (seed >>> 15), 2246822519) >>> 0;
    const j = seed % (i + 1); [segs[i], segs[j]] = [segs[j], segs[i]];
  }
  return segs;
}
const nameOf = (g, s) => blind(g) ? String.fromCharCode(65 + order(g).indexOf(s)) : s.label;

// ------------------------------------------------------------------ audio
function ctx() { return S.ctx ??= new (window.AudioContext || window.webkitAudioContext)(); }
async function decode(seg) {
  if (S.buf[seg.id]) return S.buf[seg.id];
  const data = await (await fetch(`/files/${encodeURIComponent(S.name)}/${seg.file}`)).arrayBuffer();
  return S.buf[seg.id] = await ctx().decodeAudioData(data);
}
function mono(b) {
  const x = new Float32Array(b.length);
  for (let c = 0; c < b.numberOfChannels; c++) { const d = b.getChannelData(c); for (let i = 0; i < x.length; i++) x[i] += d[i] / b.numberOfChannels; }
  return x;
}
function activeRms(x, sr) {          // loudness of the part that sounds: 50 ms blocks within 20 dB of the loudest
  const n = Math.max(1, Math.floor(sr * 0.05)), e = [];
  for (let i = 0; i + n <= x.length; i += n) { let s = 0; for (let j = i; j < i + n; j++) s += x[j] * x[j]; e.push(s / n); }
  if (!e.length) return 1e-9;
  const top = maxOf(e), keep = e.filter(v => v > top / 100);
  return Math.sqrt(keep.reduce((a, b) => a + b, 0) / keep.length) || 1e-9;
}
function levels(g) {                // equal loudness: every segment brought to the group's median, never clipping
  const r = g.segments.map(s => S.ana[s.id].rms), sorted = r.slice().sort((a, b) => a - b);
  const target = sorted[Math.floor(sorted.length / 2)];
  g.segments.forEach((s, i) => S.gain[s.id] = Math.min(target / r[i], 0.99 / S.ana[s.id].peak));
}
function position() {
  if (!S.play) return 0;
  const t = ctx().currentTime - S.play.at + S.play.from;
  return S.loop ? t % S.play.dur : Math.min(t, S.play.dur);
}
function stop() {
  if (S.play) { try { S.play.src.stop(); } catch (e) {} S.play = null; }
  cancelAnimationFrame(S.raf); document.querySelectorAll(".seg.playing").forEach(e => e.classList.remove("playing"));
  drawHeads();
}
async function play(seg, from = null) {
  const keep = from == null && S.play ? position() : null;
  const b = await decode(seg);
  if (ctx().state === "suspended") await ctx().resume();    // made while decoding, before any click: starts asleep
  stop();
  const t0 = Math.max(0, Math.min(from ?? keep ?? 0, b.duration - 0.01));
  const src = ctx().createBufferSource(), gain = ctx().createGain();
  src.buffer = b; src.loop = S.loop;
  gain.gain.value = S.match ? (S.gain[seg.id] ?? 1) : 1;
  src.connect(gain).connect(ctx().destination);
  src.start(0, t0);
  src.onended = () => { if (S.play && S.play.src === src) stop(); };
  S.play = { seg: seg.id, src, at: ctx().currentTime, from: t0, dur: b.duration }; S.last = seg;
  document.querySelectorAll(".seg").forEach(e => e.classList.toggle("playing", e.dataset.id === seg.id));
  tick();
}
function tick() { drawHeads(); if (S.play) S.raf = requestAnimationFrame(tick); }

// ------------------------------------------------------------------ analysis (STFT on a log-frequency axis)
const ROWS = 160, FMIN = 50;
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const a = -2 * Math.PI / len, wr = Math.cos(a), wi = Math.sin(a);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ur = re[i + k], ui = im[i + k], vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci,
              vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
        re[i + k] = ur + vr; im[i + k] = ui + vi; re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
      }
    }
  }
}
function analyse(seg) {
  if (S.ana[seg.id]) return S.ana[seg.id];
  const b = S.buf[seg.id], x = mono(b), sr = b.sampleRate, N = 2048, hop = Math.max(64, Math.round(sr * 0.004));
  const fmax = Math.min(16000, sr / 2), frames = Math.max(1, Math.floor((x.length - N) / hop) + 1);
  const win = Float32Array.from({ length: N }, (_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N));
  const lo = [], hi = [];
  for (let r = 0; r < ROWS; r++) {
    const f0 = FMIN * (fmax / FMIN) ** (r / ROWS), f1 = FMIN * (fmax / FMIN) ** ((r + 1) / ROWS);
    lo.push(Math.floor(f0 * N / sr)); hi.push(Math.max(Math.floor(f0 * N / sr) + 1, Math.ceil(f1 * N / sr)));
  }
  const db = new Float32Array(frames * ROWS), energy = new Float32Array(frames), re = new Float64Array(N), im = new Float64Array(N);
  for (let f = 0; f < frames; f++) {
    for (let i = 0; i < N; i++) { re[i] = (x[f * hop + i] || 0) * win[i]; im[i] = 0; }
    fft(re, im);
    let e = 0;
    for (let r = 0; r < ROWS; r++) {
      let p = 0; for (let k = lo[r]; k < hi[r]; k++) p += re[k] * re[k] + im[k] * im[k];
      p /= hi[r] - lo[r]; e += p; db[f * ROWS + r] = 10 * Math.log10(p + 1e-12);
    }
    energy[f] = e;
  }
  const top = maxOf(energy), ltas = new Float64Array(ROWS); let used = 0;
  for (let f = 0; f < frames; f++) if (energy[f] > top / 1e4) { used++; for (let r = 0; r < ROWS; r++) ltas[r] += 10 ** (db[f * ROWS + r] / 10); }
  const ltasDb = Array.from(ltas, v => 10 * Math.log10(v / Math.max(used, 1) + 1e-12));
  let peak = 0; for (const v of x) peak = Math.max(peak, Math.abs(v));
  return S.ana[seg.id] = { db, frames, hop, sr, dur: b.duration, fmax, ltas: ltasDb, rms: activeRms(x, sr), peak: peak || 1,
                            max: maxOf(db) };
}

// ------------------------------------------------------------------ drawing
const MAGMA = [[0, 0, 4], [40, 11, 84], [101, 21, 110], [159, 42, 99], [212, 72, 66], [245, 125, 21], [250, 193, 39], [252, 255, 164]];
const DIV = [[33, 102, 172], [67, 147, 195], [146, 197, 222], [20, 20, 24], [244, 165, 130], [214, 96, 77], [178, 24, 43]];
function ramp(stops, t) {
  t = Math.min(Math.max(t, 0), 1) * (stops.length - 1);
  const i = Math.min(Math.floor(t), stops.length - 2), u = t - i, a = stops[i], b = stops[i + 1];
  return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
}
function sizeCanvas(c) {
  const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  c.width = Math.max(1, Math.round(r.width * d)); c.height = Math.max(1, Math.round(r.height * d));
  return c.getContext("2d");
}
function column(a, x, W) { return Math.min(a.frames - 1, Math.floor(x / W * a.frames)); }
function diffGrid(a, ref, W) {      // dB above / below the reference, on the same time line, smoothed: the trend
  const D = new Float32Array(W * ROWS), B = new Float32Array(W * ROWS), k = Math.max(1, Math.round(W / 150));
  for (let x = 0; x < W; x++) {
    const f = column(a, x, W), fr = column(ref, x, W);
    for (let r = 0; r < ROWS; r++)
      D[x * ROWS + r] = Math.max(-40, a.db[f * ROWS + r] - a.max) - Math.max(-40, ref.db[fr * ROWS + r] - ref.max);
  }
  for (let x = 0; x < W; x++) for (let r = 0; r < ROWS; r++) {
    let s = 0, n = 0;
    for (let i = Math.max(0, x - k); i <= Math.min(W - 1, x + k); i++)
      for (let j = Math.max(0, r - 2); j <= Math.min(ROWS - 1, r + 2); j++) { s += D[i * ROWS + j]; n++; }
    B[x * ROWS + r] = s / n;
  }
  return B;
}
function drawSpec(canvas, a, top, ref) {
  const g = sizeCanvas(canvas), W = canvas.width, H = canvas.height, img = g.createImageData(W, H);
  const D = ref ? diffGrid(a, ref, W) : null;
  for (let x = 0; x < W; x++) {
    const f = column(a, x, W);
    for (let y = 0; y < H; y++) {
      const r = Math.min(ROWS - 1, Math.floor((H - 1 - y) / H * ROWS));
      const c = ref ? ramp(DIV, 0.5 + D[x * ROWS + r] / 30) : ramp(MAGMA, 1 + (a.db[f * ROWS + r] - top) / 80);
      const o = (y * W + x) * 4; img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  g.fillStyle = "#ffffff55"; g.font = `${10 * (window.devicePixelRatio || 1)}px system-ui`;
  for (const hz of [100, 1000, 4000, 10000]) {
    if (hz > a.fmax) continue;
    const y = H - Math.log(hz / FMIN) / Math.log(a.fmax / FMIN) * H;
    g.fillRect(0, y, 6, 1); g.fillText(hz >= 1000 ? `${hz / 1000}k` : `${hz}`, 8, y + 3);
  }
}
function drawHeads() {
  document.querySelectorAll(".viz").forEach(v => {
    const c = v.querySelector(".head"), g = sizeCanvas(c), id = v.dataset.id, a = S.ana[id];
    if (!a) return;
    g.clearRect(0, 0, c.width, c.height);
    for (const m of (ga().marks || [])) if (m.seg === id) {
      const x = m.t / a.dur * c.width; g.fillStyle = "#4ade80"; g.fillRect(x - 1, 0, 2, c.height);
    }
    if (S.play && S.play.seg === id) { const x = position() / a.dur * c.width; g.fillStyle = "#fff"; g.fillRect(x - 1, 0, 2, c.height); }
  });
}
const PAL = ["#f97316", "#38bdf8", "#a3e635", "#e879f9", "#facc15", "#f87171", "#2dd4bf", "#c4b5fd", "#fb7185"];
function drawLtas(canvas, g) {
  const ctx2 = sizeCanvas(canvas), W = canvas.width, H = canvas.height, d = window.devicePixelRatio || 1;
  const segs = order(g), fmax = Math.min(...segs.map(s => S.ana[s.id].fmax));
  const norm = segs.map(s => {          // each curve set to 0 dB on average over 200 Hz-4 kHz: the shapes compared
    const a = S.ana[s.id]; let sum = 0, n = 0;
    for (let r = 0; r < ROWS; r++) { const f = FMIN * (a.fmax / FMIN) ** ((r + 0.5) / ROWS); if (f > 200 && f < 4000) { sum += a.ltas[r]; n++; } }
    return a.ltas.map(v => v - sum / Math.max(n, 1));
  });
  ctx2.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement), muted = css.getPropertyValue("--muted"), line = css.getPropertyValue("--line");
  const hi = Math.ceil((maxOf(norm.flat()) + 3) / 6) * 6, lo = hi - 66;
  const yOf = v => (hi - v) / (hi - lo) * H, xOf = f => Math.log(f / FMIN) / Math.log(fmax / FMIN) * W;
  ctx2.font = `${10 * d}px system-ui`; ctx2.fillStyle = muted; ctx2.strokeStyle = line;
  for (const hz of [100, 300, 1000, 3000, 10000]) if (hz < fmax) { ctx2.fillRect(xOf(hz), 0, 1, H); ctx2.fillText(hz >= 1000 ? `${hz / 1000}k` : hz, xOf(hz) + 3, H - 4); }
  for (let v = hi - 6; v > lo; v -= 12) { ctx2.fillRect(0, yOf(v), W, 1); ctx2.fillText(`${v} dB`, 3, yOf(v) - 3); }
  segs.forEach((s, i) => {
    const a = S.ana[s.id];
    ctx2.strokeStyle = PAL[i % PAL.length]; ctx2.lineWidth = (s.id === g.reference ? 3 : 1.5) * d; ctx2.beginPath();
    for (let r = 0; r < ROWS; r++) {
      const f = FMIN * (a.fmax / FMIN) ** ((r + 0.5) / ROWS); if (f > fmax) break;
      const x = xOf(f), y = yOf(norm[i][r]); r ? ctx2.lineTo(x, y) : ctx2.moveTo(x, y);
    }
    ctx2.stroke();
  });
}

// ------------------------------------------------------------------ rendering
function renderList() {
  if (!S.m) return;
  $("#glist").replaceChildren(...S.m.groups.map((g, i) => h("li", { class: i === S.gi ? "cur" : "", onclick: () => openGroup(i) },
    h("span", { class: "dot" + (answered(g) ? " done" : "") }), g.title)));
  const opt = [...$("#roundSel").options].find(o => o.value === S.name);
  if (opt) opt.textContent = `${S.m.title} (${S.m.groups.filter(answered).length}/${S.m.groups.length})`;
}
async function openGroup(i) {
  stop(); S.gi = i; location.hash = `${encodeURIComponent(S.name)}/${i}`; renderList();
  const g = G();
  $("#main").replaceChildren(h("div", { class: "empty" }, "Carregando o áudio…"));
  await Promise.all(g.segments.map(decode));
  g.segments.forEach(analyse); levels(g); render();
}
function toggle(label, on, fn, key) { return h("button", { class: on ? "on" : "", onclick: fn, title: key ? `tecla ${key}` : null }, label); }
function render() {
  const g = G(), A = ga(), segs = order(g), top = Math.max(...segs.map(s => S.ana[s.id].max));
  const ref = g.reference && g.segments.find(s => s.id === g.reference);
  const rates = g.tasks.filter(t => t.type === "rate"), labels = g.tasks.filter(t => t.type === "label");
  const pick = g.tasks.find(t => t.type === "pick"), marks = g.tasks.find(t => t.type === "marks");
  const notes = g.tasks.find(t => t.type === "notes"), abx = g.tasks.find(t => t.type === "abx");
  const bar = h("div", { class: "bar" },
    h("button", { onclick: () => S.gi > 0 && openGroup(S.gi - 1), title: "tecla ←" }, "← anterior"),
    h("button", { onclick: () => S.gi < S.m.groups.length - 1 && openGroup(S.gi + 1), title: "tecla →" }, "próximo →"),
    toggle("igualar volume", S.match, () => { S.match = !S.match; render(); }, "V"),
    toggle("repetir", S.loop, () => { S.loop = !S.loop; if (S.play) play(S.last); render(); }, "R"),
    ref ? toggle(S.view === "diff" ? "vendo: diferença vs referência" : "vendo: espectrograma", S.view === "diff",
                 () => { S.view = S.view === "diff" ? "spec" : "diff"; render(); }, "D") : null,
    S.m.blind ? toggle(blind(g) ? "revelar nomes" : "nomes revelados", !blind(g), () => { S.revealed.add(g.id); render(); }) : null,
    h("span", { class: "grow" }), h("span", { class: "status", id: "status" }, ""));
  const cards = segs.map((s, i) => {
    const a = S.ana[s.id], isRef = ref && s.id === ref.id;
    const viz = h("div", { class: "viz", "data-id": s.id, title: "clique: tocar daqui · shift+clique: marcar um momento" },
      h("canvas", { class: "spec" }), h("canvas", { class: "head" }),
      h("span", { class: "tag" }, `${a.dur.toFixed(2)} s${isRef && !blind(g) ? " · referência" : ""}` +
        (S.view === "diff" && ref && !isRef ? " · vermelho: mais forte que a referência, azul: mais fraco (±15 dB)" : "")));
    viz.addEventListener("click", ev => {
      const r = viz.getBoundingClientRect(), t = (ev.clientX - r.left) / r.width * a.dur;
      if (ev.shiftKey && marks) { (A[marks.id] ??= []).push({ seg: s.id, t: +t.toFixed(3), note: "" }); save(); render(); }
      else play(s, t);
    });
    const widgets = h("div", { class: "tasks" },
      pick ? h("button", { class: A[pick.id] === s.id ? "on" : "", onclick: () => { A[pick.id] = A[pick.id] === s.id ? null : s.id; save(); render(); } },
               A[pick.id] === s.id ? "★ o melhor" : "☆ o melhor") : null,
      ...rates.map(t => h("div", { class: "rate" }, h("span", {}, t.what),
        ...[1, 2, 3, 4, 5].map(n => h("button", { class: (A[t.id] || {})[s.id] === n ? "on" : "",
          "aria-label": `${t.what} ${n}`, title: n === 1 ? `1 = ${t.low || "pouco"}` : n === 5 ? `5 = ${t.high || "muito"}` : null,
          onclick: () => { const v = (A[t.id] ??= {}); v[s.id] = v[s.id] === n ? undefined : n; save(); render(); } }, n)),
        h("div", { class: "scale" }, h("span", {}, `1 = ${t.low || "pouco"}`), h("span", {}, `5 = ${t.high || "muito"}`)))),
      ...labels.map(t => h("select", { onchange: ev => { (A[t.id] ??= {})[s.id] = ev.target.value || undefined; save(); } },
        h("option", { value: "" }, "— categoria —"), ...t.options.map(o => h("option", { value: o, selected: (A[t.id] || {})[s.id] === o }, o)))));
    const chips = blind(g) ? [] : Object.entries(s.metrics || {}).slice(0, 6).map(([k, v]) => h("span", { class: "chip" }, `${k} ${fmt(v)}`));
    return h("div", { class: "seg" + (pick && A[pick.id] === s.id ? " picked" : ""), "data-id": s.id },
      h("div", { class: "who" },
        h("div", {}, h("span", { class: "badge" }, i + 1), h("span", { class: "lbl" }, nameOf(g, s))),
        h("button", { onclick: () => play(s, 0) }, "▶ tocar"),
        s.note && !blind(g) ? h("div", { class: "sn" }, s.note) : null, h("div", { class: "chips" }, chips)),
      viz, widgets);
  });
  const panels = [];
  panels.push(h("div", { class: "panel" }, h("h3", {}, "Espectro médio (formato, alinhado em 200 Hz–4 kHz)"),
    h("canvas", { class: "cmp", id: "ltas" }),
    h("div", { class: "legend" }, ...segs.map((s, i) => h("span", {}, h("i", { style: `background:${PAL[i % PAL.length]}` }), nameOf(g, s))))));
  const keys = [...new Set(g.segments.flatMap(s => Object.keys(s.metrics || {})))];
  if (keys.length && !blind(g)) {
    const tg = g.targets || {};
    panels.push(h("div", { class: "panel" }, h("h3", {}, "Medidas"), h("div", { class: "tablewrap" }, h("table", {},
      h("tr", {}, h("th", {}, "medida"), ...segs.map(s => h("th", {}, nameOf(g, s))), Object.keys(tg).length ? h("th", {}, "alvo") : null),
      ...keys.map(k => {
        const vals = segs.map(s => (s.metrics || {})[k]), t = tg[k];
        const best = t == null ? -1 : vals.reduce((bi, v, i) => v != null && segs[i].id !== g.reference &&
          (bi < 0 || Math.abs(v - t) < Math.abs(vals[bi] - t)) ? i : bi, -1);
        return h("tr", {}, h("td", {}, k), ...vals.map((v, i) => h("td", { class: i === best ? "best" : "" }, fmt(v))),
          Object.keys(tg).length ? h("td", {}, fmt(t)) : null);
      })))));
  }
  if (abx) {
    const a = g.segments.find(s => s.id === abx.a), b = g.segments.find(s => s.id === abx.b), x = g.segments.find(s => s.id === abx.x);
    const got = A[abx.id] || {};
    panels.push(h("div", { class: "panel" }, h("h3", {}, "ABX: X é A ou B?"), h("div", { class: "abx" },
      h("button", { onclick: () => play(a, 0) }, `▶ A (${abx.options[0]})`), h("button", { onclick: () => play(b, 0) }, `▶ B (${abx.options[1]})`),
      h("button", { onclick: () => { const id = `__x_${g.id}`; S.gain[id] = S.gain[x.id]; play({ ...x, id }, 0); } }, "▶ X"),
      h("span", {}, " → "),
      h("button", { class: got.answer === a.id ? "on" : "", onclick: () => { A[abx.id] = { answer: a.id }; save(); render(); } }, "X = A"),
      h("button", { class: got.answer === b.id ? "on" : "", onclick: () => { A[abx.id] = { answer: b.id }; save(); render(); } }, "X = B"))));
  }
  if (marks) {
    const list = (A[marks.id] || []).map((m, i) => h("li", {},
      h("button", { onclick: () => play(g.segments.find(s => s.id === m.seg), Math.max(0, m.t - 0.15)) }, `▶ ${nameOf(g, g.segments.find(s => s.id === m.seg))} @ ${m.t.toFixed(2)} s`),
      h("input", { value: m.note || "", placeholder: "o que tem aqui?", oninput: ev => { m.note = ev.target.value; save(); } }),
      h("button", { "aria-label": "apagar", onclick: () => { A[marks.id].splice(i, 1); save(); render(); } }, "✕")));
    panels.push(h("div", { class: "panel" }, h("h3", {}, "Momentos marcados"),
      h("div", { class: "keys" }, "Shift+clique num espectrograma marca o momento; escreva o que ouviu."), h("ul", { class: "marks" }, list)));
  }
  if (notes) panels.push(h("div", { class: "panel" }, h("h3", {}, "Notas"),
    h("textarea", { placeholder: "o que você ouviu, o que incomoda, o que gostou…", oninput: ev => { A[notes.id] = ev.target.value; save(); } }, A[notes.id] || "")));
  if (pick) panels.unshift(h("div", { class: "bar" }, h("button", { class: A[pick.id] === "none" ? "on" : "", onclick: () => { A[pick.id] = A[pick.id] === "none" ? null : "none"; save(); render(); } }, "nenhum é bom")));
  $("#main").replaceChildren(...[
    S.gi === 0 && S.m.intro ? h("div", { class: "intro" }, S.m.intro) : null, bar,
    h("h2", {}, g.title), g.note ? h("div", { class: "note" }, g.note) : null,
    h("div", { class: "keys" }, h("kbd", {}, "1–9"), " tocar (troca no mesmo ponto) · ", h("kbd", {}, "espaço"), " parar/voltar · ",
      h("kbd", {}, "←"), h("kbd", {}, "→"), " grupos · ", h("kbd", {}, "R"), " repetir · ", h("kbd", {}, "V"), " volume igual",
      ref ? [" · ", h("kbd", {}, "D"), " diferença"] : null),
    h("div", { style: "height:10px" }), ...cards, ...panels].filter(Boolean));
  requestAnimationFrame(() => {
    document.querySelectorAll(".viz").forEach(v => {
      const a = S.ana[v.dataset.id], isRef = ref && v.dataset.id === ref.id;
      drawSpec(v.querySelector(".spec"), a, top, S.view === "diff" && ref && !isRef ? S.ana[ref.id] : null);
    });
    drawLtas($("#ltas"), g); drawHeads();
    if (S.play) document.querySelectorAll(".seg").forEach(e => e.classList.toggle("playing", e.dataset.id === S.play.seg));
  });
}

// ------------------------------------------------------------------ keys
document.addEventListener("keydown", ev => {
  if (!S.m || ev.target.closest?.("input, textarea, select") || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const segs = order(G());
  if (/^[1-9]$/.test(ev.key) && segs[+ev.key - 1]) { play(segs[+ev.key - 1]); ev.preventDefault(); }
  else if (ev.key === " ") { S.play ? stop() : S.last && play(S.last, 0); ev.preventDefault(); }
  else if (ev.key === "ArrowRight" && S.gi < S.m.groups.length - 1) openGroup(S.gi + 1);
  else if (ev.key === "ArrowLeft" && S.gi > 0) openGroup(S.gi - 1);
  else if (ev.key.toLowerCase() === "r") { S.loop = !S.loop; if (S.play) play(S.last); render(); }
  else if (ev.key.toLowerCase() === "v") { S.match = !S.match; render(); }
  else if (ev.key.toLowerCase() === "d" && G().reference) { S.view = S.view === "diff" ? "spec" : "diff"; render(); }
});
let resizeT; window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => S.m && render(), 200); });
loadRounds();
</script>
